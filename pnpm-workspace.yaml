allowBuilds:
  esbuild: true

# react 18 pinned by project spec; stop transitive deps pulling v19 types
overrides:
  "@types/react": ^18.3.31
  "@types/react-dom": ^18.3.7
  # transitive dev dep; 8.5.23 fixes the sourceMappingURL arbitrary-file read
  postcss: ^8.5.23
  # drei > three-stdlib; 0.6.11 fixes the unzipSync ZIP64 infinite loop
  fflate: ^0.6.11
